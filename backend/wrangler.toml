name = "accountant-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "accountant-db"
database_id = "replace-with-production-d1-id"
migrations_dir = "migrations"

[vars]
ACCESS_TOKEN_TTL_SECONDS = "900"

APP_MIN_VERSION_CODE = "1"
APP_LATEST_VERSION_CODE = "2"
APP_LATEST_VERSION_NAME = "1.1.0"
